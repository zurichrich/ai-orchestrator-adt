# ADT project config — EXAMPLE / SCHEMA REFERENCE.
#
# You do NOT edit this file. Run ./adt-install.sh from inside your project; it
# generates ~/.adt/projects/<name>.yaml (kept out of this repo so your paths
# and addresses never enter git). This file documents every field adt-install.sh
# writes plus the optional ones power users can add by hand.
#
# Loader precedence: ~/.adt/projects/<name>.yaml shadows projects/<name>.yaml.
#
# Round-trip safety (ADT-066): every hand-authored field below SURVIVES a
# re-run and an uninstall→reinstall. Install deep-merges its core fields onto
# your existing config (never overwrites the file); uninstall backs the config
# up to <name>.yaml.bak instead of deleting it, and reinstall merges from that.
# So adding optional keys by hand is safe — ADT won't clobber them.

# ── Required (adt-install.sh fills these in) ───────────────────────────────────
name: example                                   # project + cache namespace
path: /Users/you/Developer/example              # your project's checkout (abs)
main_branch: main
remote: origin
claude_md: CLAUDE.md
cache_dir: /Users/you/.adt/example/cache        # tickets live here (outside the repo)
decision_log: docs/decisions.md                 # ADR log, relative to path; /adt-decide appends here

# ── Optional: the worktree guard (multi-agent-git-workflow.md §A.3) ──────────
# Paths the canonical checkout must not be edited in: space-separated fnmatch
# patterns relative to `path`, where `*` also matches `/`. Quote the value.
# Install copies it into the project's .adt/config.yaml, where
# adt-worktree-guard.sh reads it; re-run install after changing it. Absent means
# the guard does nothing.
# worktree_guard_paths: "src/* tools/*.py"

# ── Optional: where per-install rollups go (ADT-254) ──────────────────────────
# `tools/adt_rollup.py` writes ONE file per install per month,
# `<install-id>-<YYYY-MM>.tsv`, holding counts only — no ticket id, no session
# id, no path, no branch, no prose. `tools/build_dashboard.py` reads every file
# it finds here.
#
# Unset, rollups stay in `<project>/development-team/.adt-state/rollup/` and the
# dashboard reports one install. Point SEVERAL machines at one synced directory
# — Dropbox, iCloud, a private repo — and every machine appears, with no other
# change anywhere. That works because each install writes only its own file, so
# there is nothing to merge and nothing to lock; files that are never co-written
# need no sync protocol.
# rollup_dir: /Users/you/Dropbox/adt-rollups
merger: you                                     # GitHub login that merges PRs

github:
  repo: you/example                             # the existing repo to back the backlog
  owner: you
  board_title: "example backlog"
  # stages: omit → ADT default 7-lane lifecycle:
  #   [ideas, planned, building, qa, blocked, ready-to-release, done]
  # Override only if your team uses different column names.
  #
  # branch_protection — written by setup.sh --init-github, not by you. On an
  # unprotected main_branch it offers server-side branch protection (PR
  # required, no force-push, no deletion) and applies it only if you say yes.
  # Say no and it records `declined` here so you are never asked again; delete
  # the line to be asked next time. An already-protected repo is reported and
  # left alone — the API call REPLACES the whole ruleset, so ADT never writes
  # over protection you already have.
  # branch_protection: declined

kanban:
  id_prefix: EXM                                # ticket ids: EXM-1, EXM-2, … (== issue #)
  board_out: /Users/you/.adt/example/cache/kanban.html
  # commands_doc_src — Source for the generated references.html page (the 📖
  # references link in the board header). For a SUBMODULE layout the watcher
  # finds it automatically (agent-dev-team/docs/references.md, then a
  # docs/references.md fallback). For a DE-VENDORED layout (ADT consumed from an
  # external clone, no in-repo submodule), adt-install.sh records the ABSOLUTE
  # path here AND setup.sh --init-github copies it into <project>/.adt/config.yaml
  # — the file the renderer actually reads (ADT-066 defect 3). So you don't need
  # to set it by hand. Override only if the doc lives elsewhere.
  # commands_doc_src: /abs/path/to/agent-dev-team/docs/references.md

# ── Standard / discovered — you do NOT configure these ─────────────────────
# These used to be per-project config; they're now built into ADT or discovered
# from your repo, so they're intentionally absent:
#   • tests        — QA/build playbooks DETECT your test runner from the repo
#                    (pytest / npm test / go test / Makefile / CLAUDE.md). No
#                    test_commands field.
#   • stage_tools  — the kanban column captions are a built-in ADT default.
#   • deploy       — release gating uses ADT defaults; record deploy specifics
#                    in your project's CLAUDE.md, not here.
#   • sync_docs    — /adt-release-check checks whatever docs the diff touches.
#   • decisions    — recorded as GitHub issues / the backlog, not a config blob.

# ── Optional (add by hand if you need them) ────────────────────────────────


