# Deliberately minimal: this sets `norecursedirs` and NOTHING else.
#
# WHY it does not set `testpaths`: the full suite here is shell + python and is
# not inferable from the layout (see CLAUDE.md's Testing block, which names what
# runs). Setting `testpaths` would make `pytest` look authoritative while
# silently omitting every hook and installer test -- worse than making the
# caller name what it runs.
[pytest]
norecursedirs = .git __pycache__
